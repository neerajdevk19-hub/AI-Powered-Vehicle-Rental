services:
  # 1. React Frontend (Static Site)
  - type: web
    name: driveai-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: driveai-backend
          property: host

  # 2. NestJS Backend API Service
  - type: web
    name: driveai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: driveai-db
          property: connectionString
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: driveai-python-service
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  # 3. Python AI Microservice (FastAPI)
  - type: web
    name: driveai-python-service
    env: docker
    dockerfilePath: ./python-service/Dockerfile
    dockerContext: ./python-service
    envVars:
      - key: PORT
        value: 8000

databases:
  # Managed PostgreSQL Database
  - name: driveai-db
    databaseName: vehicledb
    plan: free
