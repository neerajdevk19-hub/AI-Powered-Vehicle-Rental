services:
  # 1. React Frontend (Static Site)
  - type: web
    name: driveai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: driveai-backend
          property: host

  # 2. NestJS Backend API Service (Native Node.js - Free)
  - type: web
    name: driveai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run prisma:seed && npm run start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: driveai-db
          property: connectionString
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: driveai-python-service
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  # 3. Python AI Microservice (Native Python - Free)
  - type: web
    name: driveai-python-service
    env: python
    plan: free
    rootDir: python-service
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

databases:
  # Managed PostgreSQL Database (Free)
  - name: driveai-db
    databaseName: vehicledb
    plan: free
