services:
  # 1. React Frontend (Static Site)
  - type: web
    name: driveai-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: driveai-backend
          property: host

  # 2. NestJS Backend API Service (Native Node.js - Free)
  - type: web
    name: driveai-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: driveai-db
          property: connectionString
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: driveai-python-service
          property: host
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  # 3. Python AI Microservice (Native Python - Free)
  - type: web
    name: driveai-python-service
    env: python
    plan: free
    buildCommand: cd python-service && pip install -r requirements.txt
    startCommand: cd python-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: ./python-service

databases:
  # Managed PostgreSQL Database (Free)
  - name: driveai-db
    databaseName: vehicledb
    plan: free
